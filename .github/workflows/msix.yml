name: MSIX

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64
          cache: pip
          cache-dependency-path: host/pyproject.toml

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: pwsh
        run: |
          npm.cmd ci --prefix ui
          if ($LASTEXITCODE -ne 0) { throw "UI dependency installation failed." }
          python -m venv host\.venv
          if ($LASTEXITCODE -ne 0) { throw "Python environment creation failed." }
          host\.venv\Scripts\python.exe -m pip install .\host pip-licenses
          if ($LASTEXITCODE -ne 0) { throw "Host dependency installation failed." }
          $muscriptorSource = & host\.venv\Scripts\python.exe -c "import tomllib; from pathlib import Path; print(tomllib.load(Path('host/pyproject.toml').open('rb'))['tool']['mizan']['muscriptor-inference-source'])"
          if ($LASTEXITCODE -ne 0) { throw "MuScriptor source lookup failed." }
          if ([string]::IsNullOrWhiteSpace($muscriptorSource)) { throw "Pinned MuScriptor source was not found." }
          host\.venv\Scripts\python.exe -m pip install --no-deps $muscriptorSource
          if ($LASTEXITCODE -ne 0) { throw "MuScriptor installation failed." }

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must be vMAJOR.MINOR.PATCH." }
            if ($version -ne $packageVersion) { throw "Tag v$version does not match Changesets version $packageVersion." }
          } else {
            $version = $packageVersion
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build unsigned MSIX
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
        run: |
          $publisher = $env:MSIX_PUBLISHER
          if ([string]::IsNullOrWhiteSpace($publisher)) { $publisher = "CN=Mizan Development" }
          .\scripts\Build-Msix.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -Publisher $publisher `
            -SkipSign

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && vars.MIZAN_BINARY_DISTRIBUTION_READY == 'true'
        with:
          name: Mizan-${{ steps.version.outputs.version }}-msix-unsigned
          path: artifacts/Mizan_${{ steps.version.outputs.version }}_arm64.msix
          retention-days: 7
