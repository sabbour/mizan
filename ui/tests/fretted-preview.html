<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fretted instrument visual check</title>
    <style>
      html, body, #root { min-width: 0; min-height: 100%; margin: 0; }
      body { background: #ede9df; font: 16px "Segoe UI", sans-serif; }
      main { max-width: 1480px; margin: 0 auto; padding: 16px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import { GuitarView } from '/src/workspace/GuitarView.tsx'
      import { BassView } from '/src/workspace/BassView.tsx'
      import { buildSong } from '/src/workspace/song.ts'
      import '/src/index.css'
      import '/src/workspace/workspace.css'

      const query = new URLSearchParams(location.search)
      const instrument = query.get('instrument') === 'bass' ? 'bass' : 'guitar'
      const example = query.get('example') ?? 'open'
      const id = `preview-${instrument}`
      const track = { id, instrument: 'other', name: instrument === 'bass' ? 'Electric bass' : 'Electric guitar' }
      const defaultNotes = instrument === 'bass'
        ? [{ midi: 28, startBeat: 0, beats: 1 }, { midi: 33, startBeat: 0.5, beats: 1 }, { midi: 38, startBeat: 1, beats: 2 }]
        : [{ midi: 40, startBeat: 0, beats: 1 }, { midi: 45, startBeat: 0.5, beats: 1 }, { midi: 50, startBeat: 1, beats: 2 }]
      const examples = {
        guitar: {
          // A let-ring arpeggio: notes overlap, so not every sounding note can be fretted at once.
          letring: [[6, 7, 0, 2], [4, 1, 0.5, 2], [6, 0, 1, 1.5], [5, 2, 1.5, 2.5], [6, 5, 2, 2], [3, 0, 2.5, 3],
            [4, 2, 3, 2], [6, 7, 3.5, 1], [2, 0, 4, 4], [5, 1, 4.5, 2.5], [6, 0, 5, 1], [4, 2, 5.5, 2], [3, 3, 6, 2],
            [6, 8, 6.5, 1.5], [4, 1, 7, 1], [5, 3, 7.5, 0.5]].map(([string, fret, startBeat, beats]) =>
            ({ midi: [40, 45, 50, 55, 59, 64][string - 1] + fret, string, fret, startBeat, beats })),
          open: [{ midi: 40, string: 1, fret: 0, startBeat: 0, beats: 4 }],
          // A C-major chord shape: open A, G string fret 2 and B string fret 1 (neighbouring strings, two fingers).
          cshape: [
            { midi: 45, string: 2, fret: 0, startBeat: 0, beats: 2 },
            { midi: 57, string: 4, fret: 2, startBeat: 0, beats: 2 },
            { midi: 60, string: 5, fret: 1, startBeat: 0, beats: 2 },
          ],
          mixed: [
            { midi: 40, string: 1, fret: 0, startBeat: 0, beats: 1 },
            { midi: 43, string: 1, fret: 3, finger: 3, startBeat: 1, beats: 1 },
            { midi: 45, string: 2, fret: 0, startBeat: 2, beats: 1 },
            { midi: 48, string: 2, fret: 3, finger: 3, startBeat: 3, beats: 1 },
            { midi: 40, string: 1, fret: 0, startBeat: 4, beats: 1 },
            { midi: 44, string: 1, fret: 4, finger: 4, startBeat: 5, beats: 1 },
            { midi: 50, string: 3, fret: 0, startBeat: 6, beats: 1 },
            { midi: 53, string: 3, fret: 3, finger: 3, startBeat: 7, beats: 1 },
          ],
          single: [{ midi: 43, string: 1, fret: 3, finger: 3, startBeat: 0, beats: 2 }],
          'single-index': [{ midi: 43, string: 1, fret: 3, finger: 1, startBeat: 0, beats: 2 }],
          chord: [
            { midi: 40, string: 1, fret: 0, startBeat: 0, beats: 2 },
            { midi: 47, string: 2, fret: 2, startBeat: 0, beats: 2 },
            { midi: 52, string: 3, fret: 2, startBeat: 0, beats: 2 },
            { midi: 55, string: 4, fret: 0, startBeat: 0, beats: 2 },
            { midi: 59, string: 5, fret: 0, startBeat: 0, beats: 2 },
            { midi: 64, string: 6, fret: 0, startBeat: 0, beats: 2 },
          ],
          barre: [
            { midi: 41, string: 1, fret: 1, finger: 1, startBeat: 0, beats: 2 },
            { midi: 48, string: 2, fret: 3, finger: 3, startBeat: 0, beats: 2 },
            { midi: 53, string: 3, fret: 3, finger: 3, startBeat: 0, beats: 2 },
            { midi: 57, string: 4, fret: 2, finger: 2, startBeat: 0, beats: 2 },
            { midi: 60, string: 5, fret: 1, finger: 1, startBeat: 0, beats: 2 },
            { midi: 65, string: 6, fret: 1, finger: 1, startBeat: 0, beats: 2 },
          ],
          stretch: [
            { midi: 41, string: 1, fret: 1, startBeat: 0, beats: 2 },
            { midi: 50, string: 2, fret: 5, startBeat: 0, beats: 2 },
            { midi: 59, string: 3, fret: 9, startBeat: 0, beats: 2 },
          ],
        },
        bass: {
          open: [{ midi: 28, string: 1, fret: 0, startBeat: 0, beats: 4 }],
          mixed: [
            { midi: 28, string: 1, fret: 0, startBeat: 0, beats: 1 },
            { midi: 31, string: 1, fret: 3, finger: 3, startBeat: 1, beats: 1 },
            { midi: 33, string: 2, fret: 0, startBeat: 2, beats: 1 },
            { midi: 36, string: 2, fret: 3, finger: 3, startBeat: 3, beats: 1 },
          ],
          single: [{ midi: 31, string: 1, fret: 3, finger: 3, startBeat: 0, beats: 2 }],
          chord: [
            { midi: 35, string: 2, fret: 2, startBeat: 0, beats: 2 },
            { midi: 40, string: 3, fret: 2, startBeat: 0, beats: 2 },
            { midi: 45, string: 4, fret: 2, startBeat: 0, beats: 2 },
          ],
        },
      }
      const notes = examples[instrument][example] ?? defaultNotes
      const song = { ...buildSong(), title: 'Visual check', bars: 4, bpm: 84, beatsPerBar: 4,
        chords: [], chordLabels: [], piano: [], instrumentNotes: { [id]: notes } }
      const countingIn = query.get('phase') === 'count-in'
      const props = {
        song, track, trackId: id, beat: countingIn ? -0.5 : 0, playing: false, countingIn, onPick() {},
        handedness: query.get('handedness') === 'left' ? 'left' : 'right',
      }
      const style = query.get('style')
      if (style) props.style = style
      const View = instrument === 'bass' ? BassView : GuitarView
      const root = createRoot(document.getElementById('root'))
      const show = (extra) => root.render(React.createElement('main', null,
        React.createElement(View, { ...props, ...extra })))
      // Lets a visual check step through playback beats without an audio engine.
      window.__previewSet = (beat, playing) => show({ beat, playing })
      show({})
    </script>
  </body>
</html>
