[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan"
version = "0.1.0"
description = "Local desktop host for Mizan"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pywebview @ git+https://github.com/pointerapp/pywebview-tbd.git@a2bf0df4a4728b170cb02f1f1f698387fbaf0379",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "onnxruntime-windowsml==1.27.1.202607110137",
    "wasdk-Microsoft.Windows.AI.MachineLearning[all]==1.8.260209005",
    "wasdk-Microsoft.Windows.ApplicationModel.DynamicDependency.Bootstrap==2.3.0",
    "mido==1.3.3",
    "yt-dlp==2026.8.19",
    "torch @ https://download-r2.pytorch.org/whl/cpu/torch-2.14.0%2Bcpu-cp312-cp312-win_arm64.whl#sha256=420e7dbed969bbd045b34105fa90d1ccf3e5c09c4e9b0d0a5f9df25df9d02d2e",
    "safetensors==0.8.0",
    "einops==0.8.2",
    "huggingface-hub==1.32.0",
    "azure-identity>=1.20,<2",
    "azure-containerregistry>=1.2,<2",
    "cryptography==46.0.3",
]

[tool.mizan]
muscriptor-inference-source = "muscriptor @ git+https://github.com/muscriptor/muscriptor.git@7f213afecf23bd6a1b8672aa223690ee9807cefb"
muscriptor-version = "0.3.0"

[project.optional-dependencies]
dev = ["pytest", "pip-licenses"]
probe = ["onnx==1.23.0"]

[tool.setuptools.packages.find]
include = ["mizan*"]

[tool.setuptools.package-data]
mizan = ["*.runtimeconfig.json", "assets/*.ico", "cloud_worker/Dockerfile", "cloud_worker/worker.py"]
