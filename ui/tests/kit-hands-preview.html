<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drum kit and piano hands visual check</title>
    <style>
      html, body, #root { min-width: 0; min-height: 100%; margin: 0; }
      body { background: #ede9df; font: 16px "Segoe UI", sans-serif; }
      main { max-width: 1480px; margin: 0 auto; padding: 16px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // ?view=drums|piano &example=<name> &style=<kit:look> &variant=... A fake clock: set window.__t = { beat, playing, countingIn, countBeat }.
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import { DrumKitView } from '/src/workspace/DrumKitView.tsx'
      import { PianoView } from '/src/workspace/PianoView.tsx'
      import { buildSong } from '/src/workspace/song.ts'
      import { stickingFor } from '/src/workspace/sticking.ts'
      import '/src/index.css'
      import '/src/workspace/workspace.css'

      const query = new URLSearchParams(location.search)
      const view = query.get('view') === 'piano' ? 'piano' : 'drums'
      const example = query.get('example') ?? (view === 'piano' ? 'chord' : 'groove')
      const hit = (lane, startBeat, hand, extra = {}) => ({ lane, startBeat, velocity: 0.8, ...(hand ? { hand } : {}), ...extra })
      const groove = [
        ...[0, 1, 2, 3].flatMap((beat) => [hit('hihat', beat, 'right', { sourceMidi: 42 }), hit('hihat', beat + 0.5, 'right', { sourceMidi: 42 })]),
        hit('kick', 0), hit('kick', 2), hit('snare', 1, 'left'), hit('snare', 3, 'left'),
      ]
      const drumExamples = {
        groove,
        'groove-unwritten': groove.map(({ hand, ...rest }) => rest),
        fill: [hit('snare', 0, 'right'), hit('hightom', 0.5, 'left', { sourceMidi: 50 }), hit('hightom', 1, 'right', { sourceMidi: 47 }),
          hit('floortom', 1.5, 'left', { sourceMidi: 43 }), hit('floortom', 2, 'right', { sourceMidi: 43 }), hit('crash', 3, 'right'), hit('kick', 3)],
        sparse: [hit('snare', 2, 'left'), hit('ride', 4, 'right')],
      }
      const note = (midi, startBeat, beats, hand, finger) => ({ midi, startBeat, beats, ...(hand ? { hand } : {}), ...(finger ? { finger } : {}), velocity: 0.8 })
      const pianoExamples = {
        chord: [note(60, 0, 2, 'right', 1), note(64, 0, 2, 'right', 3), note(67, 0, 2, 'right', 5), note(48, 0, 2, 'left', 5), note(55, 0, 2, 'left', 1),
          note(62, 2, 2, 'right', 1), note(65, 2, 2, 'right', 3), note(69, 2, 2, 'right', 5), note(50, 2, 2, 'left', 5), note(57, 2, 2, 'left', 1)],
        melody: [[60, 1], [62, 2], [64, 3], [65, 1], [67, 2], [69, 3], [71, 4], [72, 5]].map(([midi, finger], index) => note(midi, index * 0.5, 0.5, 'right', finger))
          .concat([note(48, 0, 4, 'left', 5), note(55, 2, 2, 'left', 2)]),
        scale: [[60, 1], [62, 2], [64, 3], [65, 1], [67, 2], [69, 3], [71, 4], [72, 5]].map(([midi, finger], index) => note(midi, index * 0.5, 0.5, 'right', finger)),
        nohands: [note(60, 0, 1), note(64, 1, 1), note(67, 2, 1), note(48, 0, 4), note(72, 3, 1)],
        suggested: [note(60, 0, 1, 'right'), note(62, 1, 1, 'right'), note(64, 2, 1, 'right'), note(48, 0, 2, 'left'), note(55, 0, 2, 'left')],
        black: [note(61, 0, 1, 'right', 2), note(63, 1, 1, 'right', 3), note(66, 2, 1, 'right', 2), note(68, 3, 1, 'right', 3)],
        registers: [note(21, 0, 1, 'left', 5), note(48, 1, 1, 'left', 1), note(60, 2, 1, 'right', 1),
          note(61, 3, 1, 'right', 2), note(84, 4, 1, 'right', 4), note(108, 5, 1, 'right', 5)],
      }
      const base = buildSong()
      const makeSong = (pianoExample) => ({ ...base, title: 'Visual check', bars: 4, bpm: 100, beatsPerBar: 4, chords: [], chordLabels: [], source: 'course',
        drums: view === 'drums' ? (drumExamples[example] ?? groove) : [], piano: view === 'piano' ? (pianoExamples[pianoExample] ?? pianoExamples.chord) : [] })
      // A taller stage stands in for the workspace, where the kit stage grows to fill the split view.
      if (query.get('stage')) document.head.append(Object.assign(document.createElement('style'), { textContent: `.practice-kit .practice-stage { height: ${query.get('stage')}px !important; }` }))
      window.__t = { playing: false, countingIn: false, countBeat: 0, beat: Number(query.get('beat') ?? 0) }
      const engine = { loop: null, getEffectiveQuarterBpm: () => 100, read: () => window.__t }
      window.__engine = engine
      function App() {
        const [pianoExample, setPianoExample] = React.useState(example)
        const song = React.useMemo(() => makeSong(pianoExample), [pianoExample])
        window.__song = song
        window.__setPianoExample = (name) => setPianoExample(name)
        const [style, setStyle] = React.useState(query.get('style') ?? 'electronic:Realistic')
        const sticking = query.get('sticking') === 'off' ? undefined : stickingFor(song)
        return React.createElement('main', null, view === 'drums'
          ? React.createElement(DrumKitView, { song, engine, sticking, style, onStyle: setStyle })
          : React.createElement(PianoView, { song, engine, fingering: query.get('fingering') !== 'off', letters: query.get('letters') === 'on' }))
      }
      createRoot(document.getElementById('root')).render(React.createElement(App))
    </script>
  </body>
</html>
